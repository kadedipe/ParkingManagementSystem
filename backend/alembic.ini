# ============================================================================
# Parking Management System - Alembic Configuration
# Database migration management for SQLAlchemy
# ============================================================================

# ============================================================================
# Alembic Core Configuration
# ============================================================================

[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration files
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d_%%(minute).2d_%%(second).2d_%%(slug)s

timezone = UTC
truncate_slug_length = 40
revision_environment = true
production = false

# The database URL is intentionally overridden by DATABASE_URL in env.py.
# This fallback keeps local Alembic commands usable without secrets.
sqlalchemy.url = postgresql://user:password@localhost:5432/parking_db

pool_size = 5
max_overflow = 10
pool_timeout = 30
pool_recycle = 3600
sqlalchemy.echo = false
sqlalchemy.echo_pool = false
sqlalchemy.pool_pre_ping = true
version_table = alembic_version
version_table_schema =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

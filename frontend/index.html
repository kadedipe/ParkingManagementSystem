<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1976d2" />
    <meta name="application-name" content="Parking Management System" />
    <meta name="description" content="A production-ready parking management system for parking, vehicles, notifications, charging, and operations." />
    <meta name="author" content="Parking Management System Team" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <title>Parking Management System</title>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Parking Management System" />
    <meta property="og:description" content="A production-ready parking management system." />
    <meta property="og:url" content="/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Parking Management System" />
    <meta name="twitter:description" content="A production-ready parking management system." />
    <link rel="icon" href="/vite.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; frame-src https://js.stripe.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self';" />
    <style>
      :root { --primary-color:#1976d2; --primary-light:#42a5f5; --text-primary:#1a1a1a; --text-secondary:#666; --background-default:#f5f5f5; --font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
      *,*::before,*::after { box-sizing:border-box; }
      html,body,#root { min-height:100%; }
      html { scroll-behavior:smooth; }
      body { margin:0; font-family:var(--font-family); background:var(--background-default); color:var(--text-primary); }
      .app-loading { min-height:100vh; display:grid; place-items:center; text-align:center; padding:2rem; }
      .app-loading-content { display:grid; gap:1rem; justify-items:center; }
      .app-loading-spinner { width:40px; height:40px; border:4px solid var(--primary-light); border-top-color:var(--primary-color); border-radius:50%; animation:spin .8s linear infinite; }
      @keyframes spin { to { transform:rotate(360deg); } }
      @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms !important; transition-duration:.01ms !important; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-loading" aria-live="polite">
        <div class="app-loading-content">
          <strong>Parking Management System</strong>
          <div class="app-loading-spinner" aria-hidden="true"></div>
          <span>Loading application…</span>
        </div>
      </div>
    </div>
    <!-- Production entrypoint: the application is JSX-based and must load main.jsx. -->
    <script type="module" src="/src/main.jsx"></script>
    <!-- CI validation marker: this file is intentionally tracked on the PR head. -->
  </body>
</html>

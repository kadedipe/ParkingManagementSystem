# ============================================================================
# Docker Compose - Integration Test Environment
# ============================================================================

# parking-management-system/tests/integration/docker-compose.test.yml

version: '3.8'

services:
  postgres-test:
    image: postgres:15-alpine
    container_name: parking-postgres-test
    environment:
      - POSTGRES_DB=parking_test_db
      - POSTGRES_USER=test_user
      - POSTGRES_PASSWORD=test_password
    ports:
      - "5433:5432"
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d parking_test_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-test:
    image: redis:7-alpine
    container_name: parking-redis-test
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-test-data:
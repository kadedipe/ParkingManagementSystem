name: Frontend Login Visual Regression

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-login-visual.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-login-visual.yml'

permissions:
  contents: read

jobs:
  login-visual:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build:prod
      - name: Start preview and verify login visibility
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/frontend-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/login >/dev/null && break
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/frontend-preview.log
              exit 1
            fi
            sleep 1
          done
          npm run test:e2e -- --spec cypress/e2e/login-visibility.cy.js

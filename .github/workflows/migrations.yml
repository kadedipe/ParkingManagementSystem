# .github/workflows/migrations.yml
name: Database Migrations

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: parking_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d parking_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Verify Alembic configuration
        run: test -f "$GITHUB_WORKSPACE/backend/alembic.ini"

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/parking_db
        run: python -m alembic -c "$GITHUB_WORKSPACE/backend/alembic.ini" upgrade head

      - name: Check migration status
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/parking_db
        run: python -m alembic -c "$GITHUB_WORKSPACE/backend/alembic.ini" current

# .github/workflows/migrations.yml
name: Database Migrations

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      validation_sha:
        description: Commit SHA to validate
        required: false
        type: string

permissions:
  contents: read

jobs:
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: parking_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U user -d parking_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.validation_sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Verify Alembic configuration
        working-directory: backend
        run: |
          test -f alembic.ini
          test -d alembic
          python - <<'PY'
          from configparser import ConfigParser
          from pathlib import Path
          config = ConfigParser()
          config.read('alembic.ini')
          assert config.has_section('alembic'), '[alembic] section is missing'
          assert config.get('alembic', 'script_location') == 'alembic'
          assert Path('alembic/env.py').is_file(), 'alembic/env.py is missing'
          print('Alembic configuration is valid')
          PY
      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/parking_db
        run: python -m alembic upgrade head
      - name: Check migration status
        working-directory: backend
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/parking_db
        run: python -m alembic current

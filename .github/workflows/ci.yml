name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  python-services:
    name: Python / ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway-service
          - parking-service
          - vehicle-service
          - notification-service
          - charging-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements*.txt
      - name: Install production dependencies
        working-directory: services/${{ matrix.service }}
        run: pip install -r requirements.txt
      - name: Install test dependencies when available
        working-directory: services/${{ matrix.service }}
        run: |
          if [ -f requirements.dev.txt ]; then pip install -r requirements.dev.txt; fi
          pip install pytest
      - name: Compile Python
        working-directory: services/${{ matrix.service }}
        run: python -m compileall -q .
      - name: Import application
        working-directory: services/${{ matrix.service }}
        env:
          ENVIRONMENT: test
          DATABASE_URL: sqlite+aiosqlite:///./ci.db
        run: |
          case "${{ matrix.service }}" in
            gateway-service) python -c 'from main import app; print(app.title)' ;;
            *) python -c 'from src.main import app; print(app.title)' ;;
          esac
      - name: Run tests
        working-directory: services/${{ matrix.service }}
        env:
          ENVIRONMENT: test
          DATABASE_URL: sqlite+aiosqlite:///./ci.db
        run: |
          pytest -q
          rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 5 ]; then exit "$rc"; fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run type-check
      - working-directory: frontend
        run: npm run build:prod
      - working-directory: frontend
        run: npm test -- --run

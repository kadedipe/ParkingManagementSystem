name: Faculty Submission Evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'frontend/**'
      - 'faculty-submission/**'
      - '.github/workflows/faculty-submission-evidence.yml'

jobs:
  running-interface-evidence:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build:prod
        env:
          VITE_EVIDENCE_MODE: 'true'
      - name: Capture parking and charging evidence
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/faculty-preview.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/login >/dev/null && break
            sleep 1
          done
          curl --fail http://127.0.0.1:4173/login >/dev/null
          npm run test:e2e -- --spec cypress/e2e/faculty-running-evidence.cy.js
      - name: Collect labelled screenshots
        if: always()
        run: |
          mkdir -p ../faculty-submission/screenshots
          find cypress/screenshots -type f -name '*.png' -exec cp {} ../faculty-submission/screenshots/ \;
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: faculty-running-interface-evidence
          path: faculty-submission/screenshots/*.png
          if-no-files-found: error

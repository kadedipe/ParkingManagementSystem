name: Docker Build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: gateway
            context: services/gateway-service
          - name: parking
            context: services/parking-service
          - name: vehicle
            context: services/vehicle-service
          - name: notification
            context: services/notification-service
          - name: frontend
            context: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          tags: parking-management/${{ matrix.name }}:ci

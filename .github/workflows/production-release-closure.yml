name: Production Release Closure

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-release-closure.yml'

permissions:
  contents: read

concurrency:
  group: production-release-closure
  cancel-in-progress: false

env:
  RAILWAY_API_URL: https://backboard.railway.com/graphql/v2
  RAILWAY_PROJECT_ID: 4f5cbf82-9b5b-45a6-b7f3-3fcf01b6e9fc
  RAILWAY_ENVIRONMENT_NAME: production

jobs:
  closure:
    name: Frontend Journey, Deployment Audit, and Log Review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Run production release closure
        shell: bash
        run: |
          test -n "${RAILWAY_TOKEN:-}" || { echo '::error::RAILWAY_TOKEN is not configured'; exit 1; }
          python3 - <<'PY'
          import json, os, re, time, urllib.error, urllib.parse, urllib.request, uuid

          api=os.environ['RAILWAY_API_URL']
          token=os.environ['RAILWAY_TOKEN']
          project_id=os.environ['RAILWAY_PROJECT_ID']
          expected_env=os.environ['RAILWAY_ENVIRONMENT_NAME']
          summary=os.environ.get('GITHUB_STEP_SUMMARY')
          report=[]

          def note(line=''):
              print(line)
              report.append(line)

          def gql(query, variables=None):
              req=urllib.request.Request(api,data=json.dumps({'query':query,'variables':variables or {}}).encode(),headers={
                  'Content-Type':'application/json','Project-Access-Token':token,
                  'User-Agent':'ParkingManagementSystem-Release-Closure/1.0'},method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=30) as response:
                      body=json.load(response)
              except urllib.error.HTTPError as exc:
                  raise SystemExit(f'Railway API HTTP {exc.code}: {exc.read().decode("utf-8","replace")[:800]}')
              if body.get('errors'):
                  raise SystemExit('Railway GraphQL error: '+'; '.join(e.get('message','error') for e in body['errors']))
              return body['data']

          def variables(service_id,environment_id):
              dollar=chr(36)
              query=('query variablesForServiceDeployment('+dollar+'projectId:String!,'+
                     dollar+'environmentId:String!,'+dollar+'serviceId:String!){variablesForServiceDeployment('+
                     'projectId:'+dollar+'projectId environmentId:'+dollar+'environmentId serviceId:'+
                     dollar+'serviceId)}')
              return gql(query,{'projectId':project_id,'environmentId':environment_id,'serviceId':service_id})['variablesForServiceDeployment'] or {}

          def http(method,url,data=None,bearer=None,expected=(200,)):
              body=None if data is None else json.dumps(data).encode()
              headers={'User-Agent':'ParkingManagementSystem-Release-Closure/1.0','Accept':'application/json'}
              if body is not None: headers['Content-Type']='application/json'
              if bearer: headers['Authorization']='Bearer '+bearer
              req=urllib.request.Request(url,data=body,headers=headers,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=30) as response:
                      status=response.status; raw=response.read().decode('utf-8','replace')
              except urllib.error.HTTPError as exc:
                  status=exc.code; raw=exc.read().decode('utf-8','replace')
              if status not in expected:
                  raise SystemExit(f'{method} {url} returned {status}: {raw[:500]}')
              try: payload=json.loads(raw) if raw else None
              except json.JSONDecodeError: payload=raw
              return status,payload,raw

          scope=gql('query { projectToken { projectId environmentId } }')['projectToken']
          if scope['projectId'] != project_id:
              raise SystemExit('RAILWAY_TOKEN belongs to another project')
          project=gql('''query project($id:String!){
            project(id:$id){name services{edges{node{id name}}} environments{edges{node{id name}}}}
          }''',{'id':project_id})['project']
          envs={e['node']['id']:e['node']['name'] for e in project['environments']['edges']}
          environment_id=scope['environmentId']
          if envs.get(environment_id) != expected_env:
              raise SystemExit('RAILWAY_TOKEN is not scoped to production')
          services=[e['node'] for e in project['services']['edges']]
          note('# Production release closure')
          note('')
          note(f'- Project: {project["name"]}')
          note(f'- Environment: {expected_env}')
          note('- Project-token scope: passed')

          aliases={
              'frontend':lambda n:'frontend' in n,
              'gateway':lambda n:'gateway' in n,
              'parking':lambda n:n in {'parking','parking-service'},
              'vehicle':lambda n:n in {'vehicle','vehicle-service'},
              'notification':lambda n:n in {'notification','notification-service'},
              'charging':lambda n:n in {'charging','charging-service'},
          }
          selected={}
          for role,predicate in aliases.items():
              matches=[s for s in services if predicate(s['name'].lower())]
              if len(matches)!=1:
                  raise SystemExit(f'Expected one {role} service; found: '+', '.join(s['name'] for s in matches))
              selected[role]=matches[0]

          deployments_query='''query deployments($input:DeploymentListInput!){
            deployments(input:$input,first:100){edges{node{id status createdAt}}}
          }'''
          deployment_ids={}
          note('')
          note('## Deployment audit')
          note('')
          note('| Service | Latest status |')
          note('|---|---|')
          for role,service in selected.items():
              edges=gql(deployments_query,{'input':{'projectId':project_id,'serviceId':service['id']}})['deployments']['edges']
              if not edges:
                  raise SystemExit(f'{service["name"]} has no deployment')
              latest=edges[0]['node']
              latest_status=str(latest['status']).upper()
              if latest_status in {'FAILED','CRASHED','REMOVED','REMOVING'}:
                  raise SystemExit(f'{service["name"]} latest deployment is {latest_status}')
              successful=next((edge['node'] for edge in edges if str(edge['node']['status']).upper()=='SUCCESS'),None)
              if not successful:
                  raise SystemExit(f'{service["name"]} has no recent successful deployment')
              deployment_ids[role]=successful['id']
              display=latest_status if latest_status=='SUCCESS' else latest_status+' (serving SUCCESS)'
              note(f'| {service["name"]} | {display} |')

          frontend_vars=variables(selected['frontend']['id'],environment_id)
          gateway_vars=variables(selected['gateway']['id'],environment_id)
          frontend_domain=str(frontend_vars.get('RAILWAY_PUBLIC_DOMAIN') or '').strip()
          gateway_domain=str(gateway_vars.get('RAILWAY_PUBLIC_DOMAIN') or '').strip()
          api_url=str(frontend_vars.get('VITE_API_URL') or '').rstrip('/')
          if not frontend_domain or not gateway_domain:
              raise SystemExit('Frontend or Gateway public domain is missing')
          gateway_base='https://'+gateway_domain
          frontend_base='https://'+frontend_domain
          if api_url != gateway_base:
              raise SystemExit(f'Frontend VITE_API_URL does not match public Gateway: {api_url!r}')
          note('')
          note('## Frontend-to-backend user journey')
          note('')
          note('- Frontend API configuration matches the production Gateway.')

          _,_,html=http('GET',frontend_base+'/',expected=(200,))
          http('GET',frontend_base+'/healthz',expected=(200,))
          script_paths=re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',html,re.I)
          if not script_paths:
              raise SystemExit('Frontend HTML contains no JavaScript application bundle')
          bundle_verified=False
          for path in script_paths:
              url=urllib.parse.urljoin(frontend_base+'/',path)
              _,_,bundle=http('GET',url,expected=(200,))
              if gateway_domain in bundle:
                  bundle_verified=True
                  break
          if not bundle_verified:
              raise SystemExit('Deployed frontend bundle does not contain the production Gateway domain')
          note('- Frontend root and health endpoint returned HTTP 200.')
          note('- Deployed JavaScript bundle contains the production Gateway domain.')

          suffix=str(int(time.time()))+'-'+uuid.uuid4().hex[:8]
          username='closure-'+suffix
          _,registered,_=http('POST',gateway_base+'/auth/register',{
              'username':username,'email':username+'@example.invalid',
              'password':'Closure-'+uuid.uuid4().hex+'!Aa9','full_name':'Release Closure User'
          },expected=(200,))
          access_token=registered.get('access_token') if isinstance(registered,dict) else None
          if not access_token:
              raise SystemExit('Registration returned no access token')
          http('GET',gateway_base+'/auth/me',bearer=access_token,expected=(200,))
          plate='CLS'+uuid.uuid4().hex[:8].upper()
          _,vehicle,_=http('POST',gateway_base+'/vehicles',{
              'name':'Release Closure Vehicle','plate_number':plate,'make':'Test','model':'Closure',
              'year':2026,'is_ev':True,'is_default':False
          },bearer=access_token,expected=(201,))
          vehicle_id=vehicle.get('id') if isinstance(vehicle,dict) else None
          if not vehicle_id:
              raise SystemExit('Vehicle creation returned no id')
          http('GET',gateway_base+'/vehicles',bearer=access_token,expected=(200,))
          http('GET',gateway_base+'/notifications',bearer=access_token,expected=(200,))
          http('GET',gateway_base+'/charging-stations/',bearer=access_token,expected=(200,))
          http('DELETE',gateway_base+'/vehicles/'+str(vehicle_id),bearer=access_token,expected=(204,))
          _,ready,_=http('GET',gateway_base+'/ready',expected=(200,))
          states=ready.get('services') if isinstance(ready,dict) else {}
          for role in ('parking','vehicle','notification','charging'):
              if str((states or {}).get(role,'')).lower() not in {'healthy','ready','ok'}:
                  raise SystemExit(f'Gateway readiness for {role} is not healthy: {(states or {}).get(role)}')
          note('- Registration, authenticated identity, Vehicle CRUD, Notification, and Charging requests passed.')
          note('- Gateway reports every backend service healthy.')

          fatal=re.compile(r'\b(traceback|fatal|panic|unhandled exception|out of memory|segmentation fault)\b',re.I)
          log_query='''query logs($deploymentId:String!,$limit:Int){
            deploymentLogs(deploymentId:$deploymentId,limit:$limit){timestamp message severity}
          }'''
          note('')
          note('## Observability and log review')
          note('')
          note('| Service | Lines reviewed | Error-level | Fatal signatures |')
          note('|---|---:|---:|---:|')
          fatal_hits=[]
          for role,service in selected.items():
              logs=gql(log_query,{'deploymentId':deployment_ids[role],'limit':300}).get('deploymentLogs') or []
              errors=sum(1 for line in logs if str(line.get('severity','')).upper() in {'ERROR','CRITICAL'})
              hits=[line for line in logs if fatal.search(str(line.get('message','')))]
              fatal_hits.extend((service['name'],line) for line in hits)
              note(f'| {service["name"]} | {len(logs)} | {errors} | {len(hits)} |')
          if fatal_hits:
              for service,line in fatal_hits[:10]:
                  print(f'::error::{service}: {str(line.get("message",""))[:500]}')
              raise SystemExit('Fatal signatures were found in current production deployment logs')
          note('')
          note('No crash, panic, traceback, unhandled-exception, or out-of-memory signatures were found.')
          note('')
          note('## Verdict')
          note('')
          note('**PRODUCTION RELEASE CLOSED — all release gates passed.**')
          if summary:
              with open(summary,'a',encoding='utf-8') as fh:
                  fh.write('\n'.join(report)+'\n')
          PY

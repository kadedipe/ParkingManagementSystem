name: Frontend Login Performance

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-login-performance.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-login-performance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-login-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  login-bundle-budget:
    name: Login Route Bundle Budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build production frontend
        env:
          VITE_API_URL: https://api-gateway-production-3a40.up.railway.app
        run: npm run build:prod
      - name: Enforce login-route gzip budget
        env:
          LOGIN_BUNDLE_BUDGET_KB: '550'
        run: npm run test:performance

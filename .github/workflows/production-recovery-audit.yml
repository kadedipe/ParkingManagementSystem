name: Production Recovery Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-recovery-audit.yml'
  schedule:
    - cron: '17 3 1 * *'

permissions:
  contents: read

concurrency:
  group: production-recovery-audit
  cancel-in-progress: false

env:
  RAILWAY_API_URL: https://backboard.railway.com/graphql/v2
  RAILWAY_PROJECT_ID: 4f5cbf82-9b5b-45a6-b7f3-3fcf01b6e9fc
  RAILWAY_ENVIRONMENT_NAME: production

jobs:
  recovery:
    name: Native Backup and Rollback Readiness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Audit native recovery controls
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime, json, os, time, urllib.request

          api=os.environ['RAILWAY_API_URL'];token=os.environ['RAILWAY_TOKEN'];project_id=os.environ['RAILWAY_PROJECT_ID']
          report=[]
          def note(line=''):
              print(line);report.append(line)
          def gql(q,v=None):
              req=urllib.request.Request(api,data=json.dumps({'query':q,'variables':v or {}}).encode(),headers={
                'Content-Type':'application/json','Project-Access-Token':token,
                'User-Agent':'ParkingManagementSystem-Recovery-Audit/2.0'},method='POST')
              with urllib.request.urlopen(req,timeout=30) as response:body=json.load(response)
              if body.get('errors'):raise SystemExit('; '.join(e.get('message','error') for e in body['errors']))
              return body['data']

          scope=gql('query { projectToken { projectId environmentId } }')['projectToken']
          if scope['projectId']!=project_id:raise SystemExit('Token belongs to another project')
          project=gql('''query project($id:String!){project(id:$id){
            services{edges{node{id name}}}
            environments{edges{node{id name}}}
            volumes{edges{node{id name volumeInstances{edges{node{id environmentId serviceId state mountPath currentSizeMB}}}}}}
          }}''',{'id':project_id})['project']
          envs={e['node']['id']:e['node']['name'] for e in project['environments']['edges']}
          environment_id=scope['environmentId']
          if envs.get(environment_id)!=os.environ['RAILWAY_ENVIRONMENT_NAME']:
              raise SystemExit('Token is not scoped to production')
          services=[e['node'] for e in project['services']['edges']]
          by_id={s['id']:s for s in services}
          def one(label,predicate):
              found=[s for s in services if predicate(s['name'].lower())]
              if len(found)!=1:raise SystemExit(f'Expected one {label}; found: '+', '.join(s['name'] for s in found))
              return found[0]
          postgres=one('Postgres',lambda n:'postgres' in n)
          redis=one('Redis',lambda n:n=='redis' or 'redis' in n)
          roles={
            'frontend':one('frontend',lambda n:'frontend' in n),
            'gateway':one('gateway',lambda n:'gateway' in n),
            'parking':one('parking',lambda n:n in {'parking','parking-service'}),
            'vehicle':one('vehicle',lambda n:n in {'vehicle','vehicle-service'}),
            'notification':one('notification',lambda n:n in {'notification','notification-service'}),
            'charging':one('charging',lambda n:n in {'charging','charging-service'}),
          }

          instances={}
          for edge in project['volumes']['edges']:
              volume=edge['node']
              for ie in volume.get('volumeInstances',{}).get('edges',[]):
                  instance=ie['node']
                  if instance.get('environmentId')==environment_id:
                      instances[instance.get('serviceId')]={'volume':volume,'instance':instance}
          if postgres['id'] not in instances:raise SystemExit('Postgres production volume instance not found')
          if redis['id'] not in instances:raise SystemExit('Redis production volume instance not found')

          backupq='''query backups($id:String!){
            volumeInstanceBackupList(volumeInstanceId:$id){id name createdAt expiresAt usedMB referencedMB}
          }'''
          scheduleq='''query schedules($id:String!){
            volumeInstanceBackupScheduleList(volumeInstanceId:$id){id name cron kind retentionSeconds createdAt}
          }'''
          recovery={}
          for label,service in (('Postgres',postgres),('Redis',redis)):
              vi=instances[service['id']]['instance']
              backups=gql(backupq,{'id':vi['id']})['volumeInstanceBackupList'] or []
              schedules=gql(scheduleq,{'id':vi['id']})['volumeInstanceBackupScheduleList'] or []
              recovery[label]={'service':service,'volume':instances[service['id']]['volume'],'instance':vi,
                               'backups':backups,'schedules':schedules}

          # A real Postgres backup is required. Create one only when none exists.
          pg=recovery['Postgres']
          if not pg['backups']:
              gql('''mutation backup($id:String!){volumeInstanceBackupCreate(volumeInstanceId:$id)}''',
                  {'id':pg['instance']['id']})
              for _ in range(30):
                  time.sleep(5)
                  pg['backups']=gql(backupq,{'id':pg['instance']['id']})['volumeInstanceBackupList'] or []
                  if pg['backups']:break
          if not pg['backups']:raise SystemExit('Postgres has no Railway volume backup')
          latest=max(pg['backups'],key=lambda b:str(b.get('createdAt') or ''))

          deployments='''query deployments($input:DeploymentListInput!){
            deployments(input:$input,first:100){edges{node{id status createdAt canRollback canRedeploy}}}
          }'''
          rollback={}
          for role,service in roles.items():
              nodes=[e['node'] for e in gql(deployments,{'input':{
                'projectId':project_id,'environmentId':environment_id,'serviceId':service['id']
              }})['deployments']['edges']]
              serving=next((d for d in nodes if str(d['status']).upper()=='SUCCESS'),None)
              candidate=next((d for d in nodes if d.get('canRollback')),None)
              if not serving:raise SystemExit(f'{service["name"]} has no successful deployment')
              if not candidate:raise SystemExit(f'{service["name"]} has no retained rollback candidate')
              rollback[role]={'service':service['name'],'serving':serving['id'],'candidate':candidate['id']}

          dollar=chr(36)
          vq=('query variablesForServiceDeployment('+dollar+'projectId:String!,'+dollar+'environmentId:String!,'+
              dollar+'serviceId:String!){variablesForServiceDeployment(projectId:'+dollar+'projectId environmentId:'+
              dollar+'environmentId serviceId:'+dollar+'serviceId)}')
          public={}
          for role in ('frontend','gateway'):
              v=gql(vq,{'projectId':project_id,'environmentId':environment_id,'serviceId':roles[role]['id']})['variablesForServiceDeployment'] or {}
              domain=str(v.get('RAILWAY_PUBLIC_DOMAIN') or '')
              if not domain:raise SystemExit(f'{role} public domain missing')
              public[role]='https://'+domain

          note('# Production recovery audit');note('')
          note(f'- Postgres volume: {pg["volume"]["name"]}')
          note(f'- Postgres latest native backup: {latest.get("createdAt")}')
          note(f'- Postgres backup schedules configured: {len(pg["schedules"])}')
          note('- Postgres restore capability: native backup is eligible for same-project/environment staged restore')
          rd=recovery['Redis']
          note(f'- Redis volume: {rd["volume"]["name"]}')
          note(f'- Redis native backups present: {len(rd["backups"])}')
          note('- Redis recovery model: rebuildable TTL cache; PostgreSQL remains authoritative')
          note('- Redis Pub/Sub delivery is non-durable by design; PostgreSQL records remain authoritative')
          note('- Rollback-capable retained deployment: present for all six application services')
          note('');note('## Public entry points');note('')
          note(f'- Frontend: {public["frontend"]}')
          note(f'- API Gateway: {public["gateway"]}')
          note('');note('## Rollback candidates');note('')
          note('| Role | Service | Candidate deployment |');note('|---|---|---|')
          for role,item in rollback.items():note(f'| {role} | {item["service"]} | {item["candidate"]} |')
          note('');note('Restore was deliberately not applied to production; Railway restores are staged and require an incident change decision.')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as fh:fh.write('\n'.join(report)+'\n')
          PY

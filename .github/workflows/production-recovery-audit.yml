name: Production Recovery Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-recovery-audit.yml'
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: production-recovery-audit
  cancel-in-progress: false

env:
  RAILWAY_API_URL: https://backboard.railway.com/graphql/v2
  RAILWAY_PROJECT_ID: 4f5cbf82-9b5b-45a6-b7f3-3fcf01b6e9fc
  RAILWAY_ENVIRONMENT_NAME: production
  BACKUP_PREFIX: parking-management-system/postgres
  BACKUP_RETENTION_DAYS: '30'
  BACKUP_MAX_AGE_HOURS: '26'

jobs:
  logical-backup:
    name: Encrypted PostgreSQL Backup and Restore Drill
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.BACKUP_S3_REGION }}
      S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
      S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
    steps:
      - name: Validate backup configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in PRODUCTION_DATABASE_URL BACKUP_ENCRYPTION_PASSPHRASE AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_DEFAULT_REGION S3_BUCKET; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if ((${#missing[@]})); then
            printf 'Missing required recovery secrets: %s\n' "${missing[*]}" >&2
            echo '**BLOCKED: configure the external PostgreSQL backup secrets documented in PRODUCTION_RUNBOOK.md.**' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Create, encrypt, and upload logical backup
        id: backup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backup
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          plain="backup/postgres-${stamp}.dump"
          encrypted="${plain}.enc"
          key="${BACKUP_PREFIX}/postgres-${stamp}.dump.enc"

          docker run --rm \
            -e PRODUCTION_DATABASE_URL \
            -v "$PWD/backup:/backup" \
            postgres:17-alpine \
            sh -ceu 'pg_dump "$PRODUCTION_DATABASE_URL" --format=custom --no-owner --no-privileges --file=/backup/'"$(basename "$plain")"

          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in "$plain" -out "$encrypted" -pass env:BACKUP_ENCRYPTION_PASSPHRASE
          shred -u "$plain"

          endpoint=()
          [[ -z "${S3_ENDPOINT:-}" ]] || endpoint=(--endpoint-url "$S3_ENDPOINT")
          aws "${endpoint[@]}" s3 cp "$encrypted" "s3://${S3_BUCKET}/${key}" \
            --only-show-errors --metadata "format=pg_custom,encryption=aes-256-cbc-pbkdf2"
          aws "${endpoint[@]}" s3api head-object --bucket "$S3_BUCKET" --key "$key" >/dev/null

          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "encrypted=$encrypted" >> "$GITHUB_OUTPUT"
          echo "- Encrypted logical backup uploaded: ${key}" >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce retention and verify freshness
        shell: bash
        run: |
          set -euo pipefail
          endpoint=()
          [[ -z "${S3_ENDPOINT:-}" ]] || endpoint=(--endpoint-url "$S3_ENDPOINT")
          listing="$(aws "${endpoint[@]}" s3api list-objects-v2 --bucket "$S3_BUCKET" --prefix "${BACKUP_PREFIX}/")"
          export LISTING="$listing"
          python3 - <<'PY'
          import datetime, json, os, subprocess

          data=json.loads(os.environ['LISTING'])
          objects=data.get('Contents', [])
          if not objects:
              raise SystemExit('Backup freshness gate failed: no backup objects found')
          now=datetime.datetime.now(datetime.timezone.utc)
          latest=max(datetime.datetime.fromisoformat(o['LastModified'].replace('Z','+00:00')) for o in objects)
          age=(now-latest).total_seconds()/3600
          if age > int(os.environ['BACKUP_MAX_AGE_HOURS']):
              raise SystemExit(f'Backup freshness gate failed: latest backup is {age:.1f} hours old')
          cutoff=now-datetime.timedelta(days=int(os.environ['BACKUP_RETENTION_DAYS']))
          expired=[o['Key'] for o in objects if datetime.datetime.fromisoformat(o['LastModified'].replace('Z','+00:00')) < cutoff]
          endpoint=['--endpoint-url',os.environ['S3_ENDPOINT']] if os.environ.get('S3_ENDPOINT') else []
          for key in expired:
              subprocess.run(['aws',*endpoint,'s3api','delete-object','--bucket',os.environ['S3_BUCKET'],'--key',key],check=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as fh:
              fh.write(f'- Latest backup age: {age:.2f} hours (maximum {os.environ["BACKUP_MAX_AGE_HOURS"]})\n')
              fh.write(f'- Retention enforced: {os.environ["BACKUP_RETENTION_DAYS"]} days; deleted {len(expired)} expired object(s)\n')
          PY

      - name: Restore backup into temporary PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          encrypted='${{ steps.backup.outputs.encrypted }}'
          plain="${encrypted%.enc}"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in "$encrypted" -out "$plain" -pass env:BACKUP_ENCRYPTION_PASSPHRASE

          docker run -d --rm --name recovery-audit-postgres \
            -e POSTGRES_PASSWORD=recovery-audit -e POSTGRES_DB=recovery_audit \
            -p 127.0.0.1:54329:5432 postgres:17-alpine >/dev/null
          trap 'docker stop recovery-audit-postgres >/dev/null 2>&1 || true; shred -u "$plain" "$encrypted" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            docker exec recovery-audit-postgres pg_isready -U postgres -d recovery_audit >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec recovery-audit-postgres pg_isready -U postgres -d recovery_audit
          docker exec -i recovery-audit-postgres pg_restore \
            -U postgres -d recovery_audit --no-owner --no-privileges --exit-on-error < "$plain"
          docker exec recovery-audit-postgres psql -U postgres -d recovery_audit -Atqc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema NOT IN ('pg_catalog','information_schema');" \
            | grep -Eq '^[1-9][0-9]*$'
          echo '- Temporary PostgreSQL restore drill: passed' >> "$GITHUB_STEP_SUMMARY"

  railway-readiness:
    name: Redis Classification and Six-Service Rollback Readiness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Audit Railway recovery controls
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          api=os.environ['RAILWAY_API_URL']; token=os.environ['RAILWAY_TOKEN']; project_id=os.environ['RAILWAY_PROJECT_ID']
          report=[]
          def note(line=''):
              print(line); report.append(line)
          def gql(query,variables=None):
              request=urllib.request.Request(api,data=json.dumps({'query':query,'variables':variables or {}}).encode(),headers={
                'Content-Type':'application/json','Project-Access-Token':token,
                'User-Agent':'ParkingManagementSystem-Recovery-Audit/3.0'},method='POST')
              with urllib.request.urlopen(request,timeout=30) as response: body=json.load(response)
              if body.get('errors'): raise SystemExit('; '.join(e.get('message','error') for e in body['errors']))
              return body['data']

          scope=gql('query { projectToken { projectId environmentId } }')['projectToken']
          if scope['projectId'] != project_id: raise SystemExit('Token belongs to another project')
          project=gql('''query project($id:String!){project(id:$id){services{edges{node{id name}}} environments{edges{node{id name}}}}}''',{'id':project_id})['project']
          envs={e['node']['id']:e['node']['name'] for e in project['environments']['edges']}
          environment_id=scope['environmentId']
          if envs.get(environment_id) != os.environ['RAILWAY_ENVIRONMENT_NAME']: raise SystemExit('Token is not scoped to production')
          services=[e['node'] for e in project['services']['edges']]
          def one(label,predicate):
              found=[s for s in services if predicate(s['name'].lower())]
              if len(found) != 1: raise SystemExit(f'Expected one {label}; found: '+', '.join(s['name'] for s in found))
              return found[0]
          redis=one('Redis',lambda n:n == 'redis' or 'redis' in n)
          roles={
            'frontend':one('frontend',lambda n:'frontend' in n),
            'gateway':one('gateway',lambda n:'gateway' in n),
            'parking':one('parking',lambda n:n in {'parking','parking-service'}),
            'vehicle':one('vehicle',lambda n:n in {'vehicle','vehicle-service'}),
            'notification':one('notification',lambda n:n in {'notification','notification-service'}),
            'charging':one('charging',lambda n:n in {'charging','charging-service'}),
          }

          deployments='''query deployments($input:DeploymentListInput!){deployments(input:$input,first:100){edges{node{id status createdAt canRollback}}}}'''
          rollback={}
          for role,service in roles.items():
              nodes=[e['node'] for e in gql(deployments,{'input':{'projectId':project_id,'environmentId':environment_id,'serviceId':service['id']}})['deployments']['edges']]
              serving=next((d for d in nodes if str(d['status']).upper() == 'SUCCESS'),None)
              candidate=next((d for d in nodes if d.get('canRollback')),None)
              if not serving: raise SystemExit(f'{service["name"]} has no successful deployment')
              if not candidate: raise SystemExit(f'{service["name"]} has no retained rollback candidate')
              rollback[role]={'service':service['name'],'candidate':candidate['id']}

          dollar=chr(36)
          query=('query variablesForServiceDeployment('+dollar+'projectId:String!,'+dollar+'environmentId:String!,'+dollar+'serviceId:String!){variablesForServiceDeployment(projectId:'+dollar+'projectId environmentId:'+dollar+'environmentId serviceId:'+dollar+'serviceId)}')
          public={}
          for role in ('frontend','gateway'):
              values=gql(query,{'projectId':project_id,'environmentId':environment_id,'serviceId':roles[role]['id']})['variablesForServiceDeployment'] or {}
              domain=str(values.get('RAILWAY_PUBLIC_DOMAIN') or '')
              if not domain: raise SystemExit(f'{role} public domain missing')
              public[role]='https://'+domain

          note('# Railway recovery readiness'); note('')
          note(f'- Redis service: {redis["name"]}')
          note('- Redis recovery model: rebuildable TTL cache; PostgreSQL remains authoritative')
          note('- Redis Pub/Sub delivery is non-durable by design')
          note('- Rollback-capable retained deployment: present for all six application services')
          note(f'- Frontend: {public["frontend"]}'); note(f'- API Gateway: {public["gateway"]}')
          note(''); note('| Role | Service | Candidate deployment |'); note('|---|---|---|')
          for role,item in rollback.items(): note(f'| {role} | {item["service"]} | {item["candidate"]} |')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as fh: fh.write('\n'.join(report)+'\n')
          PY

name: Railway Notification Production Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'services/notification-service/**'
      - '.github/workflows/railway-notification-deploy.yml'

permissions:
  contents: read

concurrency:
  group: railway-notification-production
  cancel-in-progress: false

env:
  RAILWAY_PROJECT_ID: 4f5cbf82-9b5b-45a6-b7f3-3fcf01b6e9fc
  RAILWAY_ENVIRONMENT: production
  NOTIFICATION_SERVICE_ID: b71282ac-fa06-4060-8e60-d220f38cc67b
  RAILWAY_NO_TELEMETRY: '1'
  DO_NOT_TRACK: '1'

jobs:
  deploy:
    name: Deploy Notification to Railway
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

    steps:
      - name: Checkout production source
        uses: actions/checkout@v4

      - name: Check Railway credential
        id: auth
        shell: bash
        run: |
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Railway deployment skipped::Add the project-scoped Railway token as repository secret RAILWAY_TOKEN, then re-run this workflow."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.auth.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Railway CLI
        if: steps.auth.outputs.configured == 'true'
        run: npm install --global @railway/cli

      - name: Link Railway project
        if: steps.auth.outputs.configured == 'true'
        run: railway link --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT"

      - name: Ensure Notification source is production main
        if: steps.auth.outputs.configured == 'true'
        run: |
          railway service source connect \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service "$NOTIFICATION_SERVICE_ID" \
            --repo "${GITHUB_REPOSITORY}" \
            --branch main

      - name: Discover Railway Postgres and Redis services
        if: steps.auth.outputs.configured == 'true'
        id: data_services
        shell: bash
        run: |
          set -euo pipefail

          railway service list --json > /tmp/railway-services.json

          mapfile -t SERVICES < <(python3 - <<'PY'
          import json
          with open('/tmp/railway-services.json', encoding='utf-8') as fh:
              data = json.load(fh)
          if isinstance(data, dict):
              items = data.get('services') or data.get('items') or data.get('data') or []
          else:
              items = data
          for item in items:
              if isinstance(item, dict):
                  name = item.get('name')
                  if name:
                      print(name)
          PY
          )

          if [ "${#SERVICES[@]}" -eq 0 ]; then
            echo "::error::Railway returned no services for the linked production environment."
            exit 1
          fi

          has_var_key() {
            local file="$1"
            local key="$2"
            python3 - "$file" "$key" <<'PY'
          import json, sys
          path, wanted = sys.argv[1], sys.argv[2]
          with open(path, encoding='utf-8') as fh:
              data = json.load(fh)

          found = False
          if isinstance(data, dict):
              if wanted in data:
                  found = True
              else:
                  items = data.get('variables') or data.get('items') or data.get('data') or []
                  if isinstance(items, dict):
                      found = wanted in items
                  elif isinstance(items, list):
                      for item in items:
                          if isinstance(item, dict) and (item.get('name') == wanted or item.get('key') == wanted):
                              found = True
                              break
          elif isinstance(data, list):
              for item in data:
                  if isinstance(item, dict) and (item.get('name') == wanted or item.get('key') == wanted):
                      found = True
                      break
          raise SystemExit(0 if found else 1)
          PY
          }

          PG_CANDIDATES=()
          REDIS_CANDIDATES=()

          for svc in "${SERVICES[@]}"; do
            if [ "$svc" = "notification" ] || [ "$svc" = "$NOTIFICATION_SERVICE_ID" ]; then
              continue
            fi
            safe_name=$(printf '%s' "$svc" | tr -cs 'A-Za-z0-9._-' '_')
            vars_file="/tmp/railway-vars-${safe_name}.json"
            if railway variable list --service "$svc" --environment "$RAILWAY_ENVIRONMENT" --json > "$vars_file" 2>/dev/null; then
              if has_var_key "$vars_file" DATABASE_URL; then
                PG_CANDIDATES+=("$svc")
              fi
              if has_var_key "$vars_file" REDIS_URL; then
                REDIS_CANDIDATES+=("$svc")
              fi
            fi
            rm -f "$vars_file"
          done

          choose_service() {
            local kind="$1"
            shift
            local candidates=("$@")
            if [ "${#candidates[@]}" -eq 0 ]; then
              return 1
            fi
            for svc in "${candidates[@]}"; do
              case "${svc,,}" in
                *"$kind"*) printf '%s\n' "$svc"; return 0 ;;
              esac
            done
            printf '%s\n' "${candidates[0]}"
          }

          PG_SERVICE=$(choose_service postgres "${PG_CANDIDATES[@]}") || {
            echo "::error::Could not find a Railway service exposing DATABASE_URL. Add/provision PostgreSQL in this project."
            exit 1
          }
          REDIS_SERVICE=$(choose_service redis "${REDIS_CANDIDATES[@]}") || {
            echo "::error::Could not find a Railway service exposing REDIS_URL. Add/provision Redis in this project."
            exit 1
          }

          echo "postgres_service=$PG_SERVICE" >> "$GITHUB_OUTPUT"
          echo "redis_service=$REDIS_SERVICE" >> "$GITHUB_OUTPUT"
          echo "Discovered PostgreSQL service: $PG_SERVICE"
          echo "Discovered Redis service: $REDIS_SERVICE"

      - name: Wire Notification to Railway data services
        if: steps.auth.outputs.configured == 'true'
        shell: bash
        env:
          PG_SERVICE: ${{ steps.data_services.outputs.postgres_service }}
          REDIS_SERVICE: ${{ steps.data_services.outputs.redis_service }}
        run: |
          set -euo pipefail
          DB_REF=$(printf '%s%s%s' '$' "{{${PG_SERVICE}.DATABASE_URL" '}}')
          REDIS_REF=$(printf '%s%s%s' '$' "{{${REDIS_SERVICE}.REDIS_URL" '}}')

          railway variable set \
            "DATABASE_URL=$DB_REF" \
            "REDIS_URL=$REDIS_REF" \
            "ENVIRONMENT=production" \
            "PORT=8080" \
            "DOCS_ENABLED=false" \
            --service "$NOTIFICATION_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --skip-deploys

      - name: Validate required Notification variables without printing secrets
        if: steps.auth.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          railway run \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service "$NOTIFICATION_SERVICE_ID" \
            --no-local \
            python3 -c 'import os,sys; required=("DATABASE_URL","REDIS_URL","JWT_SECRET","CORS_ORIGINS"); missing=[k for k in required if not os.getenv(k)]; print("Required Railway variables present:", ", ".join(k for k in required if k not in missing)); sys.exit(1 if missing else 0)'

      - name: Deploy Notification service
        if: steps.auth.outputs.configured == 'true'
        run: |
          railway up services/notification-service \
            --path-as-root \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service "$NOTIFICATION_SERVICE_ID" \
            --detach \
            --message "GitHub Actions production deploy ${GITHUB_SHA}"

      - name: Wait for terminal Railway deployment status
        if: steps.auth.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 50); do
            railway deployment list \
              --project "$RAILWAY_PROJECT_ID" \
              --environment "$RAILWAY_ENVIRONMENT" \
              --service "$NOTIFICATION_SERVICE_ID" \
              --limit 1 \
              --json > /tmp/deployments.json

            STATUS=$(python3 - <<'PY'
          import json
          with open('/tmp/deployments.json', encoding='utf-8') as fh:
              data = json.load(fh)
          if isinstance(data, dict):
              items = data.get('deployments') or data.get('items') or data.get('data') or []
          else:
              items = data
          item = items[0] if isinstance(items, list) and items else (data if isinstance(data, dict) else {})
          print(str(item.get('status') or item.get('state') or 'UNKNOWN').upper())
          PY
            )

            echo "Railway deployment status: $STATUS"
            case "$STATUS" in
              SUCCESS)
                echo "Notification deployment reached SUCCESS. Railway /health gate passed."
                exit 0
                ;;
              FAILED|CRASHED|REMOVED|REMOVING)
                echo "::error::Notification deployment reached terminal failure state: $STATUS"
                railway logs \
                  --project "$RAILWAY_PROJECT_ID" \
                  --environment "$RAILWAY_ENVIRONMENT" \
                  --service "$NOTIFICATION_SERVICE_ID" \
                  --lines 200 || true
                exit 1
                ;;
            esac
            sleep 12
          done

          echo "::error::Timed out waiting for Notification deployment to reach a terminal state."
          exit 1

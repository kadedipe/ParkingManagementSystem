name: Railway Notification Production Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'services/notification-service/**'
      - '.github/scripts/railway_notification_deploy.py'
      - '.github/workflows/railway-notification-deploy-v3.yml'

permissions:
  contents: read

concurrency:
  group: railway-notification-production
  cancel-in-progress: false

env:
  RAILWAY_API_URL: https://backboard.railway.com/graphql/v2
  RAILWAY_PROJECT_ID: 4f5cbf82-9b5b-45a6-b7f3-3fcf01b6e9fc
  RAILWAY_ENVIRONMENT_NAME: production
  NOTIFICATION_SERVICE_ID: b71282ac-fa06-4060-8e60-d220f38cc67b

jobs:
  deploy:
    name: Deploy Notification to Railway
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

    steps:
      - name: Checkout production source
        uses: actions/checkout@v4

      - name: Require Railway project token
        shell: bash
        run: |
          test -n "${RAILWAY_TOKEN:-}" || { echo '::error::RAILWAY_TOKEN is not configured'; exit 1; }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Railway API client dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Validate scope, wire data services, deploy, and wait for health gate
        run: python .github/scripts/railway_notification_deploy.py

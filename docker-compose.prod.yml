services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: parking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-change-me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d parking"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [parking]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - redis_data:/data
    networks: [parking]

  parking-service:
    build: ./services/parking-service
    environment:
      ENVIRONMENT: production
      PORT: 8080
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-local-change-me}@postgres:5432/parking
      JWT_SECRET: ${JWT_SECRET:-local-change-me-use-a-long-random-secret}
      CORS_ORIGINS: '["http://localhost:5173"]'
      DOCS_ENABLED: "true"
    depends_on:
      postgres: {condition: service_healthy}
    networks: [parking]

  vehicle-service:
    build: ./services/vehicle-service
    environment:
      ENVIRONMENT: production
      PORT: 8080
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-local-change-me}@postgres:5432/parking
      JWT_SECRET: ${JWT_SECRET:-local-change-me-use-a-long-random-secret}
      CORS_ORIGINS: '["http://localhost:5173"]'
    depends_on:
      postgres: {condition: service_healthy}
    networks: [parking]

  notification-service:
    build: ./services/notification-service
    environment:
      ENVIRONMENT: production
      PORT: 8080
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-local-change-me}@postgres:5432/parking
      JWT_SECRET: ${JWT_SECRET:-local-change-me-use-a-long-random-secret}
      REDIS_URL: redis://redis:6379/2
      CORS_ORIGINS: '["http://localhost:5173"]'
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [parking]

  charging-service:
    build: ./services/charging-service
    environment:
      ENVIRONMENT: production
      PORT: 8080
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-local-change-me}@postgres:5432/parking
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET:-local-change-me-use-a-long-random-secret}
      CORS_ORIGINS: '["http://localhost:5173"]'
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [parking]

  api-gateway:
    build: ./services/gateway-service
    environment:
      PORT: 8080
      CORS_ORIGINS: '["http://localhost:5173"]'
      PARKING_SERVICE_URL: http://parking-service:8080
      VEHICLE_SERVICE_URL: http://vehicle-service:8080
      NOTIFICATION_SERVICE_URL: http://notification-service:8080
      CHARGING_SERVICE_URL: http://charging-service:8080
    depends_on:
      - parking-service
      - vehicle-service
      - notification-service
      - charging-service
    ports:
      - "8080:8080"
    networks: [parking]

  frontend:
    build: ./frontend
    environment:
      PORT: 8080
    depends_on:
      - api-gateway
    ports:
      - "5173:8080"
    networks: [parking]

volumes:
  postgres_data:
  redis_data:

networks:
  parking:
    driver: bridge
